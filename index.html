<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FF6100" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="TWNIC × Meet Taipei 2026 現場互動三題問答挑戰。" />
  <style>
:root {
  --orange: #FF6100;
  --orange-90: #FF7019;
  --orange-10: #FFEFE6;
  --ink: #202020;
  --white: #FFFFFF;
  --gray: #E0E0E0;
  --blue: #AEDCE7;
  --green: #BBDAAC;
  --success: #228B61;
  --error: #D92F42;
  --paper: #FAF9F7;
  --font-zh: 'Source Han Sans TC','Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --font-en: 'Inter', 'Arial', sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; min-width: 320px; color: var(--ink); font-family: var(--font-zh); -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 4px solid var(--blue); outline-offset: 4px; }
[hidden] { display: none !important; }
.app { min-height: 100vh; min-height: 100dvh; position: relative; overflow: hidden; display: flex; flex-direction: column; isolation: isolate; background: var(--paper); transition: background-color .35s ease; }
.app.is-start { background: var(--orange); color: white; }
.site-header { position: relative; z-index: 10; flex-shrink: 0; width: 100%; padding: clamp(19px, 2.7vw, 45px) clamp(23px, 5.5vw, 104px); display: flex; justify-content: space-between; align-items: center; gap: 24px; }
.brand-lockup { display: flex; align-items: center; gap: clamp(12px, 1.4vw, 25px); min-width: 0; }
.brand-logo { width: clamp(104px, 10.5vw, 168px); height: auto; aspect-ratio: 1550 / 400; object-fit: contain; flex-shrink: 0; }
.app.is-start .logo-orange { display: none; }
.app:not(.is-start) .logo-light { display: none; }
.brand-divider { width: 1px; height: 28px; background: currentColor; opacity: .47; }
.brand-event { font-family: var(--font-en); font-size: clamp(10px, 1.05vw, 14px); font-weight: 650; letter-spacing: .1em; white-space: nowrap; }
.brand-event b { font-weight: 450; opacity: .8; }
.header-controls { display: flex; align-items: center; gap: clamp(12px, 2vw, 32px); }
.top-caption { font-family: var(--font-en); font-weight: 500; font-size: clamp(11px, 1.05vw, 14px); opacity: .77; white-space: nowrap; }
.utility-button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 45px; padding: 10px 15px; border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 999px; font-weight: 600; font-size: 12px; white-space: nowrap; transition: background .2s,color .2s; }
.utility-button:hover { background: rgba(255,255,255,.16); }
.app:not(.is-start) .utility-button:hover { background: var(--orange-10); }
.utility-button svg { width: 16px; height: 16px; }

/* Exhibition home screen */
.start-screen { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; padding: clamp(32px, 4vh, 60px) clamp(23px, 5.5vw, 104px) clamp(18px, 2.7vh, 36px); }
.start-sheen { position: absolute; pointer-events: none; z-index: -1; inset: 0; background: radial-gradient(ellipse 50% 58% at 86% 40%,rgba(255,255,255,.085),transparent 78%),radial-gradient(ellipse 35% 65% at 2% 100%,rgba(80,18,0,.07),transparent 78%); }
.welcome-layout { width: 100%; max-width: 1620px; margin: auto; display: grid; grid-template-columns: minmax(0,1.07fr) minmax(0,.93fr); align-items: center; gap: clamp(5px, 4vw, 72px); }
.welcome-copy { position: relative; z-index: 2; }
.welcome-kicker { margin: 0 0 clamp(19px, 3.4vh, 39px); display: flex; align-items: center; gap: 13px; font-weight: 700; letter-spacing: .16em; font-size: clamp(13px, 1.3vw, 18px); }
.kicker-dash { background: white; width: 30px; height: 2px; display: inline-block; }
.welcome-copy h1 { font-size: clamp(44px, 5.8vw, 94px); font-weight: 900; line-height: 1.24; letter-spacing: -.065em; margin: 0; white-space: nowrap; }
.welcome-copy h1 > span { display: block; }
.headline-dot { font-family: var(--font-en); font-weight: 800; color: var(--ink); }
.welcome-lead { font-size: clamp(16px, 1.48vw, 25px); line-height: 1.72; font-weight: 500; margin: clamp(17px, 2.3vh, 31px) 0 clamp(26px, 4.3vh, 62px); opacity: .95; letter-spacing: .025em; }
.start-actions { display: flex; align-items: center; gap: clamp(18px, 2vw, 36px); }
.start-button { width: clamp(192px, 19vw, 290px); min-height: clamp(75px, 8.5vh, 107px); border: 0; border-radius: 12px; color: var(--orange); background: white; padding: 13px 18px 13px 27px; display: flex; align-items: center; justify-content: space-between; font-family: var(--font-en); font-size: clamp(27px, 2.6vw, 45px); font-style: italic; font-weight: 900; box-shadow: 0 15px 35px rgba(107,35,0,.14); transition: transform .19s ease,box-shadow .19s ease; }
.start-button:hover { transform: translateY(-4px); box-shadow: 0 24px 40px rgba(107,35,0,.2); }
.start-button:active { transform: translateY(1px) scale(.98); }
.start-arrow { font-size: .9em; font-style: normal; font-weight: 400; }
.start-actions p { font-size: clamp(12px, 1.1vw, 16px); font-weight: 500; opacity: .86; }
.welcome-art { width: 100%; max-width: 690px; aspect-ratio: 1 / 1; justify-self: end; position: relative; transform: rotate(-6deg); }
.ring { position: absolute; border: 1px solid rgba(255,255,255,.27); border-radius: 50%; }
.ring-1 { inset: 9%; }
.ring-2 { inset: 25%; }
.track { position: absolute; height: 17.5%; width: 77%; transform: rotate(-40deg); border-radius: 999px; }
.track-one { left: 2%; top: 27%; background: linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.33) 84%,rgba(255,255,255,.05)); }
.track-two { left: 13%; top: 47%; background: linear-gradient(90deg,rgba(255,255,255,.02),rgba(255,244,236,.54) 80%,rgba(255,255,255,.1)); }
.track-three { left: 23%; top: 67%; background: linear-gradient(90deg,rgba(187,218,172,.01),rgba(187,218,172,.48) 82%,rgba(187,218,172,.06)); }
.art-dot { width: 24%; aspect-ratio: 1; border-radius: 50%; position: absolute; display: grid; place-items: center; transform: rotate(6deg); filter: drop-shadow(0 18px 30px rgba(126,49,0,.09)); }
.art-dot span { font-size: clamp(30px, 4.5vw, 77px); font-family: var(--font-en); font-weight: 700; font-style: italic; }
.blue-dot { top: 22%; left: 19%; background: var(--blue); color: var(--ink); }
.white-dot { top: 44%; left: 49%; background: white; color: var(--orange); }
.green-dot { top: 69%; left: 24%; background: var(--green); color: var(--ink); }
.art-caption { position: absolute; font-size: clamp(10px, 1.1vw, 16px); font-weight: 800; font-family: var(--font-en); letter-spacing: .21em; line-height: 1.7; text-align: right; top: 6%; right: 0; transform: rotate(6deg); }
.mini-orbit { position: absolute; width: 19px; height: 19px; border-radius: 50%; left: 12%; bottom: 12%; background: white; box-shadow: 0 0 0 7px rgba(255,255,255,.18); }
.welcome-bottom { max-width: 1620px; width: 100%; margin: 0 auto; display: flex; gap: 10px; align-items: center; border-top: 1px solid rgba(255,255,255,.42); padding-top: 21px; font-size: clamp(11px, 1.13vw, 15px); letter-spacing: .02em; font-weight: 500; }
.tiny-diamond { font-size: 10px; margin-right: 3px; }
.bottom-number { font: 700 13px var(--font-en); letter-spacing: .16em; margin-left: auto; }

/* Gameplay */
.game-screen { position: relative; flex: 1; padding: clamp(11px, 2vh, 30px) clamp(22px, 5.5vw, 104px) clamp(12px, 3vh, 33px); display: flex; justify-content: center; }
.game-shell { width: min(100%, 1490px); display: flex; flex-direction: column; margin: auto; }
.game-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: clamp(24px, 3.4vh, 52px); }
.game-eyebrow { font: 700 clamp(11px, .95vw, 14px) var(--font-en); letter-spacing: .14em; color: #646464; margin: 0 0 15px; }
.dot-separator { color: var(--orange); padding: 0 .3em; }
.game-heading h2 { font-size: clamp(29px, 2.9vw, 51px); line-height: 1.05; letter-spacing: -.035em; margin: 0; }
.round-english { display: inline-block; font-size: .38em; font-family: var(--font-en); font-weight: 750; letter-spacing: .06em; color: #8A8A8A; vertical-align: middle; margin-left: 11px; }
.round-progress { display: flex; align-items: flex-end; gap: clamp(8px, 1vw, 18px); }
.progress-item { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; width: clamp(60px, 7vw, 104px); }
.progress-name { color: #909090; font: 800 clamp(10px, .87vw, 14px) var(--font-en); letter-spacing: .07em; }
.progress-bar { width: 100%; height: 7px; border-radius: 12px; background: #DFDFDF; transition: background .2s; }
.progress-item.is-current .progress-name { color: var(--orange); }
.progress-item.is-current .progress-bar { background: var(--orange); }
.progress-item.is-complete .progress-name { color: #2D986E; }
.progress-item.is-complete .progress-bar { background: #77C6A6; }
.question-panel { background: white; border: 1px solid #EDEAE6; border-radius: clamp(18px, 2.5vw, 30px); padding: clamp(23px, 3.5vw, 60px); box-shadow: 0 20px 58px rgba(37,27,20,.06); }
.question-topline { display: flex; justify-content: space-between; align-items: center; gap: 18px; }
.group-pill { background: var(--orange-10); color: #A94000; border-radius: 999px; padding: 9px 17px; font-size: clamp(12px, 1.05vw, 16px); font-weight: 700; }
.group-pill.is-group-2 { background: #E5F4F8; color: #266877; }
.group-pill.is-group-3 { background: #E8F3E0; color: #477A36; }
.question-id { font: italic 800 clamp(18px, 2vw, 31px) var(--font-en); color: #B3B0AD; letter-spacing: -.06em; }
.question-title { font-weight: 800; font-size: clamp(25px, 3vw, 47px); letter-spacing: -.035em; line-height: 1.52; min-height: 1.6em; margin: clamp(21px, 3.2vh, 42px) 0 clamp(27px, 5.3vh, 67px); max-width: 1200px; }
.answer-options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(13px, 1.5vw, 24px); }
.answer-option { min-width: 0; min-height: clamp(145px, 17vh, 218px); position: relative; display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: clamp(13px, 1.6vh, 22px); background: #FFF; border: 2px solid #E0E0E0; border-radius: clamp(14px, 1.35vw, 20px); padding: clamp(18px, 1.9vw, 33px); font-size: clamp(16px, 1.44vw, 23px); font-weight: 650; text-align: left; line-height: 1.55; color: #333; transition: border-color .18s ease, background-color .18s ease, color .18s ease, box-shadow .18s ease, transform .18s ease; }
.answer-option:not(:disabled):hover { border-color: var(--orange); box-shadow: 0 8px 23px rgba(255,97,0,.085); transform: translateY(-3px); }
.answer-option:active:not(:disabled) { transform: translateY(0); }
.answer-option:disabled { cursor: default; }
.option-letter { display: grid; place-items: center; background: var(--orange); color: white; border-radius: 50%; width: clamp(44px, 3.8vw, 62px); height: clamp(44px, 3.8vw, 62px); flex: 0 0 auto; font: italic 800 clamp(21px, 2vw, 32px) var(--font-en); box-shadow: 8px 8px 0 rgba(255,97,0,.11); }
.option-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.answer-option.is-wrong { color: #B91F35; border-color: var(--error); background: #FFF0F1; animation: shake .52s cubic-bezier(.36,.07,.19,.97); }
.answer-option.is-wrong .option-letter { background: var(--error); box-shadow: 7px 7px 0 rgba(217,47,66,.13); }
.answer-option.is-correct { background: var(--success); border-color: var(--success); color: white; box-shadow: 0 8px 26px rgba(34,139,97,.12); }
.answer-option.is-correct .option-letter { background: white; color: var(--success); box-shadow: 8px 8px 0 rgba(255,255,255,.17); }
.answer-option.is-muted { background: #F2F2F2; border-color: #F2F2F2; color: #B3B5B8; }
.answer-option.is-muted .option-letter { background: #CFD1D4; box-shadow: none; }
@keyframes shake { 0%,100%{transform:translateX(0)} 10%,50%,90%{transform:translateX(-8px)} 30%,70%{transform:translateX(8px)} }
.answer-hint { min-height: 32px; margin: clamp(29px, 4.1vh, 50px) 0 0; display: flex; gap: 11px; align-items: center; justify-content: center; font-size: clamp(14px, 1.22vw, 19px); color: #8B8B8B; font-weight: 500; }
.hint-symbol { color: var(--orange); font-size: 17px; }
.answer-hint.is-error { color: var(--error); }
.answer-feedback { margin-top: clamp(24px, 3vh, 40px); display: flex; align-items: center; gap: clamp(15px, 1.7vw, 28px); padding: clamp(19px, 2vw, 31px); border-radius: clamp(14px, 1.5vw, 22px); background: #EFF8F2; border: 1px solid #CDE5D6; animation: feedback-pop .32s cubic-bezier(.2,.8,.2,1) both; }
@keyframes feedback-pop { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
.feedback-icon { width: clamp(44px, 4vw, 63px); height: clamp(44px, 4vw, 63px); flex: 0 0 auto; border-radius: 50%; background: var(--success); display: grid; place-items: center; color: #fff; font-size: clamp(20px, 2vw, 33px); font-family: var(--font-en); font-weight: 700; }
.feedback-copy { flex: 1; min-width: 0; }
.feedback-title { margin: 0 0 5px; font-size: clamp(18px, 1.8vw, 28px); color: #17754A; font-weight: 800; }
.feedback-title span { font: 750 .48em var(--font-en); vertical-align: middle; margin-left: 7px; letter-spacing: .1em; }
.feedback-text { margin: 0; font-size: clamp(14px, 1.18vw, 19px); color: #3E5C4B; line-height: 1.62; font-weight: 500; }
.next-button { display: flex; gap: 27px; align-items: center; justify-content: space-between; flex-shrink: 0; color: white; background: var(--ink); border: 0; border-radius: 13px; padding: 18px 23px; min-width: clamp(151px, 13vw, 222px); min-height: 70px; text-align: left; transition: transform .17s, background-color .17s; }
.next-button:hover { background: var(--orange); transform: translateY(-2px); }
.next-button > span:first-child { display: flex; flex-direction: column; gap: 3px; font: 800 clamp(17px, 1.6vw, 25px) var(--font-en); }
.next-button small { font: 650 clamp(12px, 1.1vw, 16px) var(--font-zh); }
.next-arrow { font-size: clamp(25px, 2.2vw, 34px); }
.game-footnote { margin: clamp(18px, 2.5vh, 29px) 0 0; font-size: clamp(11px, .95vw, 14px); color: #85817C; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.tiny-square { display: inline-block; width: 9px; height: 9px; background: var(--orange); }
.game-footnote-right { margin-left: auto; font: 650 clamp(10px,.9vw,13px) var(--font-en); letter-spacing: .06em; }
.confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.confetti { position: absolute; top: -13vh; opacity: 0; animation: falling var(--fall-time, 2.55s) var(--fall-delay, 0s) cubic-bezier(.18,.6,.4,1) forwards; }
@keyframes falling { 0%{opacity:0;transform:translate3d(0,-15px,0) rotate(0deg)} 7%{opacity:1} 89%{opacity:1} 100%{opacity:0;transform:translate3d(var(--drift,30px),116vh,0) rotate(var(--spin,650deg))} }
.toast { position: fixed; z-index: 50; bottom: 23px; left: 50%; transform: translateX(-50%); background: #202020; color: white; padding: 12px 22px; border-radius: 100px; font-size: 14px; box-shadow: 0 10px 28px rgba(0,0,0,.2); white-space: nowrap; }

 .option-letter { width: 39px; height: 39px; font-size: 20px; }

    question:'收到「雲端發票中獎 1,000 萬」的訊息並附上領獎連結，最好的處理方式是？',
    options:['立刻點擊並輸入信用卡資料','轉傳好友請大家一起領獎','先從官方管道獨立查證，不點可疑連結'], correct:2,

    question:'LINE 上好友傳來「免費領取知名超商 500 元禮券」的連結，該怎麼做？',

    explanation:'好友帳號也可能遭盜用。優惠連結先查證活動來源，不填個資、不轉傳未確認訊息。'

    question:'如果看到網址「https://brand.tw.badguy.com」，這真的是 brand.tw 官方網站嗎？',

    explanation:'網址可被放進子網域名稱來混淆視聽。真正的註冊網域是 badguy.com；HTTPS 也不代表品牌真實。'
  },
  {

    question:'TWNIC 推動的「綠色域名認證」，主要目的是為了什麼？',
    options:['保證網站商品永遠最低價','保證網站所有內容絕對安全','查核 .tw 網域註冊人的身分與資料'], correct:2,
    explanation:'綠色域名認證著重網域註冊人身分資料查核，協助辨識網站主體；並非替網站所有內容或交易背書。'

    question:'當公司註冊網域所留的管理人員換了，哪一件事情是錯的？',
    options:['繼續沿用離職員工的個人信箱與帳號、不更新','更新網域聯絡資料與授權','交接帳號與續約管理責任'], correct:0,
    explanation:'人員異動時，應更新註冊資料、檢查授權與帳號安全，避免企業網域失去管理控制權。'
  }

</script>
<script>
(() => {
  'use strict';
  const allQuestions = window.TWNIC_QUESTIONS || [];
  const groups = [
    { number:1, title:'釐清誤會 · 品牌起步評估', short:'釐清誤會' },
    { number:2, title:'創業須知', short:'創業須知' },
    { number:3, title:'網域防詐', short:'網域防詐' }
  ];

  const el = (id) => document.getElementById(id);
  const app = el('app');
  const homeScreen = el('start-screen');
  const gameScreen = el('game-screen');
  const startButton = el('start-button');
  const nextButton = el('next-button');
  const fullscreenButton = el('fullscreen-button');
  const fullscreenLabel = el('fullscreen-label');
  const progressEl = el('round-progress');
  const optionEl = el('answer-options');
  const hintEl = el('answer-hint');
  const feedbackEl = el('answer-feedback');
  const feedbackText = el('feedback-text');
  const confettiLayer = el('confetti-layer');
  const toast = el('toast');

  let questionsThisRound = [];
  let currentIndex = 0;
  let answered = false;
  let animatingWrong = false;
  let wrongTimeout = null;
  let toastTimeout = null;
  let confettiTimeout = null;
  let playNumber = 0;

  // 一回合三題：群組一 → 群組二 → 群組三，每組隨機抽出一題。
  // 不同回合允許再次抽到曾出現的題目；單回合不會重複題目。
  function drawThreeQuestions() {
    return groups.map((g) => {
      const pool = allQuestions.filter(q => q.group === g.number);
      if (!pool.length) throw new Error(`題庫群組 ${g.number} 沒有題目`);
      return pool[Math.floor(Math.random() * pool.length)];
    });
  }

  function startGame() {
    try { questionsThisRound = drawThreeQuestions(); }
    catch (error) { showToast(`無法開始：${error.message}`); return; }
    playNumber++;
    currentIndex = 0;
    answered = false;
    if (wrongTimeout) clearTimeout(wrongTimeout);
    if (confettiTimeout) clearTimeout(confettiTimeout);
    confettiLayer.replaceChildren();
    app.classList.remove('is-start');
    homeScreen.hidden = true;
    gameScreen.hidden = false;
    renderQuestion();
    window.scrollTo({top:0,behavior:'instant'});
  }

  function renderQuestion() {
    const q = questionsThisRound[currentIndex];
    const g = groups.find(item => item.number === q.group);
    if (!q) return;
    answered = false;
    animatingWrong = false;
    feedbackEl.hidden = true;
    hintEl.hidden = false;
    hintEl.classList.remove('is-error');
    hintEl.innerHTML = '<span class="hint-symbol" aria-hidden="true">✳</span> 請點選你認為正確的答案';
    el('round-heading').innerHTML = `第 ${currentIndex + 1} 題 <span class="round-english">/ ROUND 0${currentIndex + 1}</span>`;
    el('question-id').textContent = q.id;
    el('question-title').textContent = q.question;
    const pill = el('group-pill');
    pill.className = `group-pill is-group-${q.group}`;
    pill.textContent = `群組${['','一','二','三'][q.group]} · ${g.short}`;
    nextButton.querySelector('span:first-child').innerHTML = currentIndex === 2 ? 'FINISH <small>遊戲結束</small>' : 'NEXT <small>下一題</small>';
    nextButton.setAttribute('aria-label',currentIndex === 2 ? '遊戲結束，回到開始畫面' : '進入下一題');

    progressEl.replaceChildren();
    groups.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'progress-item' + (i === currentIndex ? ' is-current' : '') + (i < currentIndex ? ' is-complete' : '');
      const name = document.createElement('span');
      name.className = 'progress-name';
      name.textContent = `0${i+1}`;
      const bar = document.createElement('span');
      bar.className = 'progress-bar';
      div.append(name,bar);
      progressEl.appendChild(div);
    });
    optionEl.replaceChildren();
    q.options.forEach((txt, i) => {
      const button = document.createElement('button');
      button.className = 'answer-option';
      button.type = 'button';
      button.setAttribute('aria-label', `選項 ${'ABC'[i]}：${txt}`);
      const badge = document.createElement('span');
      badge.className = 'option-letter';
      badge.textContent = 'ABC'[i];
      const label = document.createElement('span');
      label.className = 'option-text';
      label.textContent = txt;
      button.append(badge,label);
      button.addEventListener('click', () => chooseAnswer(i, button));
      optionEl.appendChild(button);
    });
  }

  function chooseAnswer(selectedIndex, button) {
    if (answered || animatingWrong) return;
    const q = questionsThisRound[currentIndex];
    if (selectedIndex !== q.correct) {
      animatingWrong = true;
      hintEl.classList.add('is-error');
      hintEl.textContent = '再試一次！選錯的選項不會扣分。';
      button.classList.add('is-wrong');
      wrongTimeout = setTimeout(() => {
        button.classList.remove('is-wrong');
        hintEl.classList.remove('is-error');
        hintEl.innerHTML = '<span class="hint-symbol" aria-hidden="true">✳</span> 請再選擇其他答案';
        animatingWrong = false;
      }, 590);
      return;
    }

    answered = true;
    Array.from(optionEl.children).forEach((item,i) => {
      item.disabled = true;
      item.classList.add(i === selectedIndex ? 'is-correct' : 'is-muted');
    });
    hintEl.hidden = true;
    feedbackText.textContent = q.explanation;
    feedbackEl.hidden = false;
    createConfetti();
    if (window.matchMedia('(max-width: 760px)').matches) {
      setTimeout(() => feedbackEl.scrollIntoView({behavior:'smooth',block:'nearest'}), 90);
    }
  }

  function next() {
    if (!answered) return;
    if (currentIndex === 2) {
      resetToStart();
      return;
    }
    currentIndex++;
    confettiLayer.replaceChildren();
    renderQuestion();
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function resetToStart() {
    answered = false;
    questionsThisRound = [];
    confettiLayer.replaceChildren();
    gameScreen.hidden = true;
    homeScreen.hidden = false;
    app.classList.add('is-start');
    window.scrollTo({top:0,behavior:'instant'});
    startButton.focus({preventScroll:true});
  }

  function createConfetti() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (confettiTimeout) clearTimeout(confettiTimeout);
    confettiLayer.replaceChildren();
    const colors = ['#FF6100','#AEDCE7','#BBDAAC','#202020','#FFBC43','#D16BB8','#FFFFFF'];
    for (let i=0; i<90; i++) {
      const piece = document.createElement('span');
      piece.className = 'confetti';
      const x = Math.random() * 100;
      piece.style.left = `${x}%`;
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.width = `${6+Math.random()*9}px`;
      piece.style.height = `${8+Math.random()*15}px`;
      piece.style.borderRadius = Math.random()>.65 ? '50%' : '1px';
      piece.style.setProperty('--fall-time',`${2.2+Math.random()*1.5}s`);
      piece.style.setProperty('--fall-delay',`${Math.random()*.7}s`);
      piece.style.setProperty('--drift',`${-120+Math.random()*240}px`);
      piece.style.setProperty('--spin',`${-730+Math.random()*1500}deg`);
      confettiLayer.appendChild(piece);
    }
    confettiTimeout = setTimeout(() => confettiLayer.replaceChildren(), 4900);
  }

  function showToast(message) {
    if (toastTimeout) clearTimeout(toastTimeout);
    toast.textContent = message;
    toast.hidden = false;
    toastTimeout = setTimeout(() => toast.hidden = true, 2600);
  }

  async function toggleFullscreen() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) { try { await exit.call(document); } catch(e) { showToast('無法退出全螢幕'); } }
      return;
    }
    const request = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
    if (!request) {
      showToast('此瀏覽器不支援網頁全螢幕；可將網站加入主畫面或使用展場 Kiosk 模式。');
      return;
    }
    try { await request.call(document.documentElement); }
    catch(error) { showToast('無法進入全螢幕，請改用瀏覽器全螢幕或 Kiosk 模式。'); }
  }

  function syncFullscreen() {
    const active = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
    fullscreenLabel.textContent = active ? '離開全螢幕' : '全螢幕';
    fullscreenButton.setAttribute('aria-label', active ? '離開全螢幕' : '進入全螢幕');
  }

  function validateQuestions() {
    const ids = new Set();
    const counts = [0,0,0];
    for(const q of allQuestions) {
      if(ids.has(q.id)) throw new Error(`重複題號：${q.id}`);
      ids.add(q.id);
      if(![1,2,3].includes(q.group) || q.options?.length !== 3 || ![0,1,2].includes(q.correct)) throw new Error(`題目資料有誤：${q.id}`);
      counts[q.group-1]++;
    }
    if (allQuestions.length !== 20 || counts.join(',') !== '7,7,6') {
      console.warn('題庫數量與預定 7／7／6 不同：', counts);
    }
  }

  startButton.addEventListener('click', startGame);
  nextButton.addEventListener('click', next);
  fullscreenButton.addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', syncFullscreen);
  document.addEventListener('webkitfullscreenchange', syncFullscreen);
  document.addEventListener('keydown', (event) => {
    if (event.altKey || event.ctrlKey || event.metaKey || event.repeat) return;
    if (event.key.toLowerCase() === 'f' && !event.target.closest('input,textarea')) { event.preventDefault(); toggleFullscreen(); }
    if (event.key === 'Enter' && event.target === document.body) {
      if (homeScreen.hidden && answered) next();
      else if (!homeScreen.hidden) startGame();
    }
    if (homeScreen.hidden && !answered && !animatingWrong && /^[123abc]$/i.test(event.key) && event.target === document.body) {
      let i = Number(event.key) - 1;
      if (!Number.isInteger(i) || i < 0) i = 'abc'.indexOf(event.key.toLowerCase());
      const button = optionEl.children[i];
      if (button) chooseAnswer(i,button);
    }
  });

  try { validateQuestions(); }
  catch(err) { console.error(err); showToast(`題庫設定錯誤：${err.message}`); }
  // file:// 下仍可離線使用；在 HTTPS 或 localhost 下可用 PWA 快取。
  // Public GitHub Pages preview: service worker disabled to avoid stale builds.
})();

</script>
